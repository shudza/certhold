# e2e topology: a certhold manager and three alpine peers on a single
# user-defined bridge network. Service names double as DNS names on that network,
# so the manager reaches peers as `peer1`/`peer2`/`peer3` and peers reach the
# manager as `manager`. peer1/peer2 use target user `deploy`; peer3 is the
# root-via-`--user root` scenario (files in /root/.ssh).
#
# Build contexts are the repo root (../..) so the manager image can compile the
# certhold binary from source; the Dockerfiles live under test/e2e.

services:
  manager:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.manager
    hostname: manager
    environment:
      # The enroll one-liner must point peers at the `manager` DNS name.
      CERTHOLD_BASE_URL: "https://manager:8443"
      # Non-interactive passphrases for init/enroll/update/group/revoke/rekey.
      # init's default branch reuses the CA passphrase for the manager peer key,
      # and pushes read CERTHOLD_PEER_PASSPHRASE, so both share one value.
      CERTHOLD_CA_PASSPHRASE: "e2e-ca-pass"
      CERTHOLD_PEER_PASSPHRASE: "e2e-ca-pass"
    networks:
      - chnet

  peer1:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.peer
    hostname: peer1
    environment:
      # Leave the installed peer key UNENCRYPTED so peer->peer ssh is
      # non-interactive (an encrypted key would prompt at /dev/tty).
      CERTHOLD_NO_PASSPHRASE: "1"
    networks:
      - chnet

  peer2:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.peer
    hostname: peer2
    environment:
      CERTHOLD_NO_PASSPHRASE: "1"
    networks:
      - chnet

  # peer3 is enrolled with --user root and the install one-liner runs AS root,
  # so its certhold files land in /root/.ssh. Same image/env as the deploy peers.
  peer3:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.peer
    hostname: peer3
    environment:
      CERTHOLD_NO_PASSPHRASE: "1"
    networks:
      - chnet

  # peer4/peer5 are dedicated to the client-peer flow (TestE2E step 10):
  # peer4 hosts the host-style peer app01 (push target), peer5 hosts the
  # client-style peer laptop (`enroll --client`, pull-only via certhold-cli).
  peer4:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.peer
    hostname: peer4
    environment:
      CERTHOLD_NO_PASSPHRASE: "1"
    networks:
      - chnet

  peer5:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile.peer
    hostname: peer5
    environment:
      CERTHOLD_NO_PASSPHRASE: "1"
    networks:
      - chnet

networks:
  chnet:
    driver: bridge
